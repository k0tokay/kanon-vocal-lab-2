<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VTL</title>
<script>
  // Apply the remembered theme before the first paint.
  try { const t = localStorage.getItem("ui.theme"); if (t === "dark" || t === "light") document.documentElement.dataset.theme = t; } catch {}
</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
